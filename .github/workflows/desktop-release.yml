name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#desktop-v}" -w apps/desktop
      - run: npm run build -w @pulse/desktop
      - name: Build installers
        working-directory: apps/desktop
        run: npx electron-builder --publish never
        env:
          # No Apple signing identity yet; ship an unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Publishing here, not from electron-builder, keeps the release on the pushed desktop-v* tag.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
            apps/desktop/release/*-mac.zip
            apps/desktop/release/latest*.yml
